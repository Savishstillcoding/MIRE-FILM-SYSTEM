# Production: code is baked into the images; no bind mounts, DB not exposed.
#   cp .env.docker.example .env.prod   (fill in real secrets, APP_KEY, APP_URL)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [mire]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [mire]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [mire]

volumes:
  db-data:
  app-storage:

networks:
  mire:
